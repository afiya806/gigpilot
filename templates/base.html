<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GigPilot. The all-in-one freelance operations platform for Indian professionals. Email parsing, GST invoicing, contract review, tax planning, and project tracking.">
    <meta name="author" content="GigPilot">
    <meta property="og:title" content="GigPilot">
    <meta property="og:description" content="All-in-one back-office for freelancers: parse client emails, generate GST invoices, scan contracts, estimate taxes, and track every project.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#111111">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <title>{% block title %}GigPilot{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        neutral: {
                            25: '#FCFCFC',
                            50: '#FAFAFA',
                            75: '#F5F5F5',
                            100: '#F0F0F0',
                            150: '#E8E8E8',
                            200: '#E0E0E0',
                            300: '#C8C8C8',
                            400: '#A0A0A0',
                            500: '#787878',
                            600: '#585858',
                            700: '#404040',
                            800: '#282828',
                            900: '#1A1A1A',
                            950: '#111111',
                        },
                        accent: {
                            50: '#EEF4FF',
                            100: '#D9E5FF',
                            200: '#BCD2FF',
                            300: '#8EB4FF',
                            400: '#5A8CFF',
                            500: '#3366FF',
                            600: '#1A4FFF',
                            700: '#0D3FE6',
                            800: '#1034B9',
                            900: '#142F91',
                        }
                    },
                    fontSize: {
                        '2xs': ['0.625rem', { lineHeight: '0.875rem' }],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

        /* Focus */
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: #3366FF;
            box-shadow: 0 0 0 3px rgba(51,102,255,0.08);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D4D4D4; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #A3A3A3; }

        /* Sidebar */
        .nav-item { position: relative; border-radius: 6px; transition: all 0.15s ease; }
        .nav-item:hover { background: rgba(0,0,0,0.04); }
        .nav-item.active { background: rgba(0,0,0,0.06); font-weight: 600; }

        /* Animations */
        .fade-up { animation: fadeUp 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Card */
        .card {
            background: white;
            border: 1px solid #E8E8E8;
            border-radius: 10px;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card:hover {
            border-color: #D4D4D4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* Button primary */
        .btn-primary {
            background: #111111;
            color: white;
            font-weight: 500;
            font-size: 0.8125rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .btn-primary:hover { background: #282828; }
        .btn-primary:active { transform: scale(0.98); }

        /* Button secondary */
        .btn-secondary {
            background: white;
            color: #282828;
            border: 1px solid #E0E0E0;
            font-weight: 500;
            font-size: 0.8125rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }
        .btn-secondary:hover { background: #FAFAFA; border-color: #C8C8C8; }

        /* Toast */
        .toast { animation: toastIn 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .toast-out { animation: toastOut 0.2s ease forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-4px); } }

        /* Table */
        .table-row { transition: background 0.1s ease; }
        .table-row:hover { background: #FAFAFA; }

        /* Input base */
        .input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 0.875rem;
            background: white;
            transition: all 0.15s ease;
            color: #1A1A1A;
        }
        .input::placeholder { color: #A0A0A0; }

        /* Loading spinner */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid #E0E0E0;
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Sidebar overlay (mobile) */
        .sidebar-overlay { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        /* Tag / badge */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.6875rem;
            font-weight: 500;
            line-height: 1.4;
        }

        /* Counter nums */
        .tabular { font-variant-numeric: tabular-nums; }

        /* Divider */
        .divider { height: 1px; background: #F0F0F0; }

        /* Notion-style section label */
        .section-label {
            font-size: 0.6875rem;
            font-weight: 600;
            color: #787878;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-neutral-50">
    <!-- Splash Screen -->
    <div id="splashScreen" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="splash-logo-wrap mb-6">
            <img src="/static/logo.png" alt="GigPilot" class="w-16 h-16 object-contain">
        </div>
        <h1 class="text-xl font-semibold text-neutral-900 tracking-tight mb-1">GigPilot</h1>
        <p class="text-xs text-neutral-400 mb-8">Your freelance command center</p>
        <div class="splash-bar">
            <div class="splash-bar-fill"></div>
        </div>
    </div>
    <style>
        .splash-logo-wrap {
            animation: splashPulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes splashPulse {
            from { transform: scale(1); opacity: 0.85; }
            to { transform: scale(1.06); opacity: 1; }
        }
        .splash-bar {
            width: 120px; height: 3px;
            background: #F0F0F0;
            border-radius: 3px;
            overflow: hidden;
        }
        .splash-bar-fill {
            width: 0%;
            height: 100%;
            background: #111111;
            border-radius: 3px;
            animation: splashLoad 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes splashLoad {
            0% { width: 0%; }
            60% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(function() { splash.remove(); }, 500);
            }, 1600);
        });
    </script>

    <div class="min-h-full flex">
        <!-- Mobile menu button -->
        <button id="mobileMenuBtn" onclick="toggleSidebar()" class="lg:hidden fixed top-3 left-3 z-50 w-9 h-9 rounded-lg bg-white border border-neutral-200 flex items-center justify-center shadow-sm hover:bg-neutral-50 transition-colors">
            <svg class="w-4 h-4 text-neutral-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <!-- Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay fixed inset-0 bg-black/20 z-30 lg:hidden" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="w-60 bg-neutral-75 border-r border-neutral-150 flex flex-col fixed h-full z-40 -translate-x-full lg:translate-x-0 transition-transform duration-200">
            <!-- Brand -->
            <div class="px-4 pt-5 pb-3">
                <div class="flex items-center gap-2.5">
                    <img src="/static/logo.png" alt="GigPilot" class="w-7 h-7 rounded-lg object-contain">
                    <div>
                        <h1 class="text-sm font-semibold text-neutral-900 tracking-tight">GigPilot</h1>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-2.5 mt-1 space-y-0.5">
                <a href="/" class="nav-item flex items-center gap-2.5 px-2.5 py-[7px] text-[13px] {% if request.url.path == '/' %}active text-neutral-900{% else %}text-neutral-600{% endif %}">
                    <svg class="w-[18px] h-[18px] {% if request.url.path == '/' %}text-neutral-700{% else %}text-neutral-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>

                <div class="pt-4 pb-1.5 px-2.5">
                    <span class="section-label">Tools</span>
                </div>

                <a href="/email-parser" class="nav-item flex items-center gap-2.5 px-2.5 py-[7px] text-[13px] {% if request.url.path == '/email-parser' %}active text-neutral-900{% else %}text-neutral-600{% endif %}">
                    <svg class="w-[18px] h-[18px] {% if request.url.path == '/email-parser' %}text-neutral-700{% else %}text-neutral-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    Email Parser
                </a>
                <a href="/invoices" class="nav-item flex items-center gap-2.5 px-2.5 py-[7px] text-[13px] {% if request.url.path == '/invoices' %}active text-neutral-900{% else %}text-neutral-600{% endif %}">
                    <svg class="w-[18px] h-[18px] {% if request.url.path == '/invoices' %}text-neutral-700{% else %}text-neutral-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z"/></svg>
                    Invoices
                </a>
                <a href="/contracts" class="nav-item flex items-center gap-2.5 px-2.5 py-[7px] text-[13px] {% if request.url.path == '/contracts' %}active text-neutral-900{% else %}text-neutral-600{% endif %}">
                    <svg class="w-[18px] h-[18px] {% if request.url.path == '/contracts' %}text-neutral-700{% else %}text-neutral-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    Contracts
                </a>
                <a href="/tax" class="nav-item flex items-center gap-2.5 px-2.5 py-[7px] text-[13px] {% if request.url.path == '/tax' %}active text-neutral-900{% else %}text-neutral-600{% endif %}">
                    <svg class="w-[18px] h-[18px] {% if request.url.path == '/tax' %}text-neutral-700{% else %}text-neutral-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    Tax Helper
                </a>
            </nav>

            <!-- Footer -->
            <div class="px-4 py-3 border-t border-neutral-150">
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span class="text-2xs text-neutral-400">All systems online</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-60 min-h-screen">
            <div class="max-w-5xl mx-auto px-4 sm:px-8 py-6 lg:py-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('active');
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        const bg = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-600' : 'bg-neutral-900';
        toast.className = `toast flex items-center gap-2.5 px-4 py-2.5 rounded-lg ${bg} text-white shadow-lg min-w-[240px]`;
        const iconPath = type === 'error'
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>';
        toast.innerHTML = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">${iconPath}</svg><span class="text-sm">${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('toast-out'); setTimeout(() => toast.remove(), 200); }, 3000);
    }

    window.addEventListener('resize', () => {
        if (window.innerWidth >= 1024) {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
