{% extends "base.html" %}
{% block title %}Contract Scanner - GigPilot{% endblock %}
{% block content %}
<div class="fade-in">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-surface-900">Contract Scanner</h2>
        <p class="text-sm text-gray-500 mt-1">Paste a freelance contract. AI highlights red flags and unfavorable clauses.</p>
    </div>

    <div class="grid grid-cols-2 gap-6">
        <!-- Input -->
        <div>
            <div class="bg-white rounded-xl border border-gray-100 p-5">
                <label class="block text-xs font-medium text-gray-600 mb-2 uppercase tracking-wide">Contract Text</label>
                <textarea id="contractInput" rows="20" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm resize-none leading-relaxed"
                    placeholder="Paste your freelance contract or agreement here...

Example:
This agreement is between TechCorp Inc. ('Client') and the Freelancer. The Freelancer agrees to provide web development services. All intellectual property created during the engagement shall belong exclusively to the Client. The Client may terminate this agreement at any time without cause. The Freelancer shall not work with any competitor of the Client for a period of 2 years after termination..."></textarea>
                <button onclick="scanContract()" id="scanBtn"
                    class="mt-4 w-full py-2.5 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    Scan for Red Flags
                </button>
            </div>
        </div>

        <!-- Results -->
        <div>
            <div id="scanResult" class="bg-white rounded-xl border border-gray-100 p-5 min-h-[560px]">
                <div id="scanEmpty" class="flex flex-col items-center justify-center h-96 text-gray-400">
                    <svg class="w-16 h-16 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <p class="text-sm">Paste a contract to scan</p>
                </div>
                <div id="scanLoading" class="hidden flex flex-col items-center justify-center h-96">
                    <div class="w-8 h-8 border-2 border-brand-200 border-t-brand-600 rounded-full animate-spin mb-3"></div>
                    <p class="text-sm text-gray-500">AI agent scanning contract...</p>
                </div>
                <div id="scanContent" class="hidden space-y-4"></div>
            </div>
        </div>
    </div>
</div>

<script>
async function scanContract() {
    const text = document.getElementById('contractInput').value.trim();
    if (!text) return;

    document.getElementById('scanEmpty').classList.add('hidden');
    document.getElementById('scanContent').classList.add('hidden');
    document.getElementById('scanLoading').classList.remove('hidden');

    try {
        const res = await fetch('/api/scan-contract', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ contract_text: text })
        });
        const data = await res.json();
        renderScan(data);
    } catch(e) {
        document.getElementById('scanLoading').classList.add('hidden');
        document.getElementById('scanContent').innerHTML = '<p class="text-red-500 text-sm">Error scanning contract.</p>';
        document.getElementById('scanContent').classList.remove('hidden');
    }
}

function renderScan(data) {
    document.getElementById('scanLoading').classList.add('hidden');
    const c = document.getElementById('scanContent');

    const riskColors = { high: 'red', medium: 'amber', low: 'green' };
    const rc = riskColors[data.overall_risk] || 'gray';

    let html = `
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-gray-900">Scan Results</h3>
            <span class="px-3 py-1 rounded-full text-xs font-bold bg-${rc}-100 text-${rc}-700 uppercase">${data.overall_risk} risk</span>
        </div>
        <p class="text-sm text-gray-600 mb-4">${data.summary}</p>
    `;

    if (data.red_flags && data.red_flags.length > 0) {
        html += `<div class="space-y-3">
            <h4 class="text-xs font-semibold text-red-600 uppercase tracking-wide flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01"/></svg>
                Red Flags (${data.red_flags.length})
            </h4>`;
        data.red_flags.forEach(f => {
            const sc = riskColors[f.severity] || 'gray';
            html += `<div class="p-3 bg-${sc}-50 rounded-lg border border-${sc}-100">
                <div class="flex items-start justify-between mb-1">
                    <p class="text-sm font-medium text-${sc}-800">${f.issue}</p>
                    <span class="text-xs px-1.5 py-0.5 rounded bg-${sc}-200 text-${sc}-800">${f.severity}</span>
                </div>
                <p class="text-xs text-gray-600 italic mb-2">"${f.clause}"</p>
                <p class="text-xs text-${sc}-700"><strong>Suggestion:</strong> ${f.suggestion}</p>
            </div>`;
        });
        html += '</div>';
    }

    if (data.favorable_terms && data.favorable_terms.length > 0) {
        html += `<div class="mt-4 space-y-2">
            <h4 class="text-xs font-semibold text-green-600 uppercase tracking-wide">Favorable Terms</h4>`;
        data.favorable_terms.forEach(f => {
            html += `<div class="p-2.5 bg-green-50 rounded-lg flex items-start gap-2">
                <svg class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <p class="text-sm text-green-800">${f.clause}: ${f.reason}</p>
            </div>`;
        });
        html += '</div>';
    }

    if (data.missing_clauses && data.missing_clauses.length > 0) {
        html += `<div class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-100">
            <h4 class="text-xs font-semibold text-amber-700 mb-2">Missing Clauses</h4>
            <ul class="space-y-1">${data.missing_clauses.map(m =>
                `<li class="text-sm text-amber-800 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>${m}</li>`
            ).join('')}</ul>
        </div>`;
    }

    c.innerHTML = html;
    c.classList.remove('hidden');
}
</script>
{% endblock %}
