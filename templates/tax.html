{% extends "base.html" %}
{% block title %}Tax Helper - GigPilot{% endblock %}
{% block content %}
<div class="fade-in">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-surface-900">Tax Helper</h2>
        <p class="text-sm text-gray-500 mt-1">Estimate advance tax, track TDS, and plan quarterly payments (Indian tax system).</p>
    </div>

    <div class="grid grid-cols-5 gap-6">
        <!-- Input Form -->
        <div class="col-span-2">
            <div class="bg-white rounded-xl border border-gray-100 p-5">
                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Income Details (FY 2025-26)</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Gross Annual Income (INR)</label>
                        <input id="grossIncome" type="number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="1200000" value="1200000">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Business Expenses (INR)</label>
                        <input id="expenses" type="number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="200000" value="200000">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">TDS Already Deducted (INR)</label>
                        <input id="tdsPaid" type="number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="50000" value="50000">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Tax Regime</label>
                        <select id="regime" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm">
                            <option value="new" selected>New Regime (Default)</option>
                            <option value="old">Old Regime</option>
                        </select>
                    </div>
                    <div id="oldRegimeFields" class="hidden space-y-3">
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Section 80C Deductions</label>
                            <input id="ded80c" type="number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="150000" value="0">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Health Insurance (80D)</label>
                            <input id="ded80d" type="number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="25000" value="0">
                        </div>
                    </div>
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox" id="presumptive" class="rounded border-gray-300 text-brand-600">
                        <span class="text-gray-700">Use Presumptive Taxation (44ADA)</span>
                    </label>
                    <button onclick="estimateTax()" class="w-full py-2.5 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors">
                        Calculate Tax
                    </button>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div class="col-span-3">
            <div id="taxResult" class="space-y-5">
                <div id="taxEmpty" class="bg-white rounded-xl border border-gray-100 p-5 flex flex-col items-center justify-center min-h-[400px] text-gray-400">
                    <svg class="w-16 h-16 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    <p class="text-sm">Enter your income details and calculate</p>
                </div>
                <div id="taxContent" class="hidden space-y-5"></div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('regime').addEventListener('change', function() {
    document.getElementById('oldRegimeFields').classList.toggle('hidden', this.value !== 'old');
});

async function estimateTax() {
    const data = {
        gross_income: parseFloat(document.getElementById('grossIncome').value) || 0,
        expenses: parseFloat(document.getElementById('expenses').value) || 0,
        tds_paid: parseFloat(document.getElementById('tdsPaid').value) || 0,
        regime: document.getElementById('regime').value,
        deductions_80c: parseFloat(document.getElementById('ded80c')?.value) || 0,
        health_insurance_80d: parseFloat(document.getElementById('ded80d')?.value) || 0,
        use_presumptive: document.getElementById('presumptive').checked,
    };

    try {
        const res = await fetch('/api/estimate-tax', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        renderTax(result);
    } catch(e) {
        alert('Error calculating tax.');
    }
}

function fmt(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

function renderTax(d) {
    document.getElementById('taxEmpty').classList.add('hidden');
    const c = document.getElementById('taxContent');

    let html = `
        <!-- Summary Cards -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white rounded-xl border border-gray-100 p-4 card-hover">
                <p class="text-xs text-gray-500 mb-1">Taxable Income</p>
                <p class="text-xl font-bold text-gray-900">${fmt(d.taxable_income)}</p>
                <p class="text-xs text-gray-400 mt-1">${d.computation_method}</p>
            </div>
            <div class="bg-white rounded-xl border border-gray-100 p-4 card-hover">
                <p class="text-xs text-gray-500 mb-1">Total Tax</p>
                <p class="text-xl font-bold text-gray-900">${fmt(d.total_tax_liability)}</p>
                <p class="text-xs text-gray-400 mt-1">${d.regime} Regime | ${d.effective_tax_rate}% effective</p>
            </div>
            <div class="bg-white rounded-xl border border-purple-100 p-4 card-hover bg-purple-50">
                <p class="text-xs text-purple-600 mb-1 font-medium">Net Payable</p>
                <p class="text-xl font-bold text-purple-900">${fmt(d.net_tax_payable)}</p>
                <p class="text-xs text-purple-400 mt-1">After ${fmt(d.tds_already_paid)} TDS</p>
            </div>
        </div>

        <!-- Tax Computation -->
        <div class="bg-white rounded-xl border border-gray-100 p-5">
            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Computation</h3>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between py-1"><span class="text-gray-600">Gross Income</span><span class="font-medium">${fmt(d.gross_income)}</span></div>
                <div class="flex justify-between py-1"><span class="text-gray-600">Less: Expenses</span><span class="font-medium text-red-600">- ${fmt(d.expenses)}</span></div>
                <div class="flex justify-between py-1"><span class="text-gray-600">Less: Deductions</span><span class="font-medium text-red-600">- ${fmt(d.total_deductions)}</span></div>
                <div class="flex justify-between py-1 border-t border-gray-100 pt-2"><span class="text-gray-900 font-medium">Taxable Income</span><span class="font-bold">${fmt(d.taxable_income)}</span></div>
                <div class="flex justify-between py-1"><span class="text-gray-600">Tax on Income</span><span class="font-medium">${fmt(d.tax_before_rebate)}</span></div>
                ${d.rebate_87a > 0 ? `<div class="flex justify-between py-1"><span class="text-gray-600">Less: Rebate u/s 87A</span><span class="font-medium text-green-600">- ${fmt(d.rebate_87a)}</span></div>` : ''}
                <div class="flex justify-between py-1"><span class="text-gray-600">Health & Education Cess (4%)</span><span class="font-medium">${fmt(d.cess)}</span></div>
                <div class="flex justify-between py-1 border-t border-gray-200 pt-2"><span class="text-gray-900 font-bold">Total Tax Liability</span><span class="font-bold text-lg">${fmt(d.total_tax_liability)}</span></div>
            </div>
        </div>

        <!-- Advance Tax Schedule -->
        <div class="bg-white rounded-xl border border-gray-100 p-5">
            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Advance Tax Schedule</h3>`;

    if (d.advance_tax_schedule && d.advance_tax_schedule[0] && d.advance_tax_schedule[0].note) {
        html += `<p class="text-sm text-green-700 bg-green-50 p-3 rounded-lg">${d.advance_tax_schedule[0].note}</p>`;
    } else if (d.advance_tax_schedule) {
        html += `<div class="grid grid-cols-4 gap-3">`;
        d.advance_tax_schedule.forEach(q => {
            const isCurrent = q.quarter === d.current_quarter;
            html += `<div class="p-3 rounded-lg ${isCurrent ? 'bg-brand-50 border-2 border-brand-200' : 'bg-surface-50'}">
                <p class="text-xs font-medium ${isCurrent ? 'text-brand-600' : 'text-gray-500'}">${q.quarter} ${isCurrent ? '(Current)' : ''}</p>
                <p class="text-lg font-bold text-gray-900">${fmt(q.cumulative_amount)}</p>
                <p class="text-xs text-gray-400">Due: ${q.due_date}</p>
                <p class="text-xs text-gray-400">${q.percent}% cumulative</p>
            </div>`;
        });
        html += '</div>';
    }

    html += '</div>';

    // Tips
    if (d.tips && d.tips.length > 0) {
        html += `<div class="bg-blue-50 rounded-xl border border-blue-100 p-5">
            <h3 class="text-xs font-semibold text-blue-600 uppercase tracking-wide mb-3">Tax Tips</h3>
            <ul class="space-y-2">${d.tips.map(t =>
                `<li class="text-sm text-blue-800 flex items-start gap-2"><svg class="w-4 h-4 text-blue-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${t}</li>`
            ).join('')}</ul>
        </div>`;
    }

    // TDS Reference
    html += `<div class="bg-white rounded-xl border border-gray-100 p-5">
        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">TDS Reference Rates</h3>
        <div class="overflow-x-auto"><table class="w-full text-sm">
            <thead><tr class="border-b border-gray-100">
                <th class="text-left py-2 text-xs text-gray-500">Section</th>
                <th class="text-left py-2 text-xs text-gray-500">Description</th>
                <th class="text-right py-2 text-xs text-gray-500">Rate</th>
            </tr></thead><tbody>`;
    if (d.tds_reference) {
        Object.values(d.tds_reference).forEach(t => {
            html += `<tr class="border-b border-gray-50">
                <td class="py-2 font-medium text-gray-900">${t.section}</td>
                <td class="py-2 text-gray-600">${t.description}</td>
                <td class="py-2 text-right font-medium">${t.rate}%</td>
            </tr>`;
        });
    }
    html += '</tbody></table></div></div>';

    c.innerHTML = html;
    c.classList.remove('hidden');
}
</script>
{% endblock %}
